<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu4U - Editor de Menu</title>
    <!-- CSS Externo -->
    <link rel="stylesheet" href="../menu_editor/menu.css">
    <!-- Ícones FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="dashboard-body">

    <!-- Barra Superior -->
    <header class="top-bar">
        <div class="logo">
            <i class="fas fa-qrcode"></i> MENU4U
        </div>
        <div class="nav-right">
            <a href="index.html" class="btn-home-nav">Main Page</a>
        </div>
    </header>

    <div class="main-layout">
        <!-- Barra Lateral (Sidebar) -->
        <aside class="sidebar">
            <div class="section-title">MANAGEMENT</div>
            <ul>
                <a href="../Estatistica/estatistica.html">
                    <li><i class="fas fa-chart-line"></i> Estatísticas</li>
                </a>
                <a href="editor.html">
                    <li class="active"><i class="fas fa-utensils"></i> Menu editor</li>
                </a>
                <li><i class="fas fa-qrcode"></i> QR code</li>
                <li><i class="fas fa-clipboard-list"></i> Orders</li>
            </ul>

            <div class="section-title">ACCOUNT</div>
            <ul>
                <li><i class="far fa-user"></i> Profile</li>
                <li><i class="fas fa-cog"></i> Settings</li>
            </ul>
        </aside>

        <!-- Área Principal do Editor -->
        <main class="content-area">
            <div class="header-inline">
                <h1>Menu editor</h1>
                <button class="btn-add-dish" onclick="toggleModal()">+ Add dish</button>
            </div>

            <!-- Filtros de Categoria -->
            <div class="input-group">
                <label>Categoria</label>
                <select id="dishCategory" required>
                    <option value="Starters">Starters</option>
                    <option value="Mains">Mains</option>
                    <option value="Desserts">Desserts</option>
                    <option value="Drinks">Drinks</option>
                </select>
            </div>

            <!-- Grelha onde os pratos aparecem -->
            <div class="menu-grid" id="menuGrid">
                <!-- Pratos iniciais de exemplo (como em editor de menu.jpg) -->
                <div class="dish-card">
                    <div class="dish-img-container">🍱</div>
                    <div class="dish-info">
                        <h3>Francesinha</h3>
                        <p>Sandwich, cured meats, spicy sauce</p>
                        <span class="dish-price">€12.50</span>
                    </div>
                    <div class="card-actions">
                        <button class="btn-icon"><i class="far fa-edit"></i></button>
                        <button class="btn-icon" onclick="this.closest('.dish-card').remove()"><i
                                class="far fa-trash-alt"></i></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal para Adicionar Novo Prato -->
    <div id="dishModal" class="modal">
        <div class="modal-content">
            <h2>Novo Prato</h2>
            <form id="menuForm">
                <div class="input-group">
                    <label>Nome do Prato</label>
                    <input type="text" id="dishName" placeholder="Ex: Bacalhau à Brás" required>
                </div>
                <div class="input-group">
                    <label>Descrição/Ingredientes</label>
                    <input type="text" id="dishDesc" placeholder="Ex: Batata, ovo, bacalhau..." required>
                </div>
                <div class="input-group">
                    <label>Preço (€)</label>
                    <input type="number" id="dishPrice" step="0.01" placeholder="15.00" required>
                </div>
                <div class="input-group">
                    <label>Foto do Prato</label>
                    <input type="file" id="dishImage" accept="image/*" required>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="toggleModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar Prato</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="./menu.js"></script>
</body>

</html>
