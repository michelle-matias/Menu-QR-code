<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>menu4U</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #e6d1c3;
  color: #333;
}

/* NAVBAR */
.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 60px;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  border-bottom: 3px solid #ff7a59;
}

.menu {
  display: flex;
  gap: 40px;
}

.menu a {
  text-decoration: none;
  color: #444;
  font-size: 14px;
}

.user {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

/* HERO */
.hero {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 80px 60px;
}

/* LEFT SIDE */
.hero-text {
  max-width: 500px;
}

.hero-text h1 {
  background: #ff8a65;
  color: white;
  display: inline-block;
  padding: 15px 20px;
  font-size: 36px;
  line-height: 1.2;
}

.buttons {
  margin-top: 25px;
  display: flex;
  gap: 15px;
}

.btn {
  padding: 12px 20px;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

.btn-light {
  background: #f3e4db;
}

.btn-primary {
  background: #ff8a65;
  color: white;
}

/* RIGHT SIDE (cards) */
.cards {
  position: relative;
}

.card {
  width: 220px;
  height: 420px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  overflow: hidden;
  position: absolute;
}

/* first card */
.card1 {
  transform: rotate(-8deg);
  left: 0;
  top: 0;
}

/* second card */
.card2 {
  transform: rotate(6deg);
  left: 120px;
  top: 30px;
}

/* card content */
.card img {
  width: 100%;
  height: 140px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.card-content h3 {
  font-size: 16px;
  margin-bottom: 10px;
}

.item {
  font-size: 13px;
  margin: 6px 0;
  color: #555;
}
</style>
</head>

<body>

<header class="navbar">
  <div class="logo">Menu4U
  </div>

  <nav class="menu">
    <a href="Exemplos menu.html">Exemplos de Menus</a>
    <a href="#">Blogue</a>
  </nav>

  <a href="Login.html" class="btn-login">
  <span>👤</span> Login
</a>
<style>.btn-login {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  background-color: #e6d1c6; /* Cor do botão */
  color: rgb(27, 27, 27);
  text-decoration: none; /* Remove o sublinhado do link */
  border-radius: 5px;
  font-family: sans-serif;
  transition: background 0.3s;
}

.btn-login:hover {
  background-color: #0056b3; /* Cor ao passar o mouse */
}
</style>


</header>

<section class="hero">
  
  <div class="hero-text">
    <h1>Menu QR code, que funciona para si</h1>

    <div class="buttons">
  <button class="btn btn-light" onclick="window.location.href='Exemplos menu.html'">
    Exemplo de menu
  </button>

  <button class="btn btn-primary" onclick="window.location.href='Login.html'">
    Criar menu QR code
  </button>
</div>
  <div class="cards">

    <div class="card card1">
      <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" />
      <div class="card-content">
        <h3>OddMenu Demo</h3>
        <div class="item">Hot Meals</div>
        <div class="item">Salads</div>
        <div class="item">Desserts</div>
        <div class="item">Breakfasts</div>
      </div>
    </div>

    <div class="card card2">
      <img src="https://images.unsplash.com/photo-1551024601-bec78aea704b" />
      <div class="card-content">
        <h3>Desserts</h3>
        <div class="item">Strawberry mousse</div>
        <div class="item">Ice cream</div>
        <div class="item">Cake slice</div>
      </div>
    </div>

  </div>

</section>

</body>
</html>
