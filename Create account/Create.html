<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu4U - Criar Conta</title>
    <link rel="stylesheet" href="create.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="login-page">
    <!-- Script específico para registo, se necessário -->
    <script src="register.js"></script>

    <!-- Navegação Superior (Idêntica ao Login) -->
    <header class="navbar">
        <div class="logo">
            <a href="../main/main.html" ; text-decoration: none;">
                <i class="fas fa-qrcode"></i> Menu4U
            </a>
        </div>
        <div class="auth-buttons">
            <a href="../main/main.html" class="btn-main-page">Home Page</a>
        </div>
    </header>

    <!-- Conteúdo Centralizado -->
    <main class="login-container">
        <div class="login-card">
            <div class="card-header">
                <i class="fas fa-qrcode" style="font-size: 2rem; color: #5d7a5d;"></i>
                <h2>Menu4U</h2>
                <p>Create your account to start</p>
            </div>

            <!-- Formulário de Registo -->
            <form id="registerForm">
                <div class="input-group">
                    <label>Restaurant Name</label>
                    <input type="text" placeholder="My Awesome Restaurant" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="exemplo@email.pt" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-signin-active">Create account</button>
            </form>

            <!-- Rodapé do Card invertendo a lógica para Login -->
            <div class="card-footer">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
